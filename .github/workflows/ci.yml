name: CI & MCP Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run lint

      - name: Run Unit Test Suite
        run: npm test

      - name: Verify CLI Binary on Hardened Config
        run: node bin/mcp-guard.mjs audit examples/hardened.mcp.json

      - name: Build Web Inspector Bundle
        run: npm run build
